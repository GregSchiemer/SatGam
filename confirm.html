<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SatGam Phone Network Confirmation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #10131a;
      --panel: #1c2230;
      --text: #f5f7fb;
      --muted: #b8c0d4;
      --button: #f5f7fb;
      --button-text: #10131a;
      --border: #3a4358;
      --warning: #ffe7a3;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.45;
      color: var(--text);
      background: var(--bg);
    }

    main {
      max-width: 680px;
      margin: 0 auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin: 18px 0;
    }

    h1 {
      font-size: 2rem;
      line-height: 1.15;
      margin: 0 0 12px;
    }

    h2 {
      font-size: 1.25rem;
      margin: 0 0 12px;
    }

    p {
      margin: 0 0 14px;
    }

    .muted {
      color: var(--muted);
    }

    .warning {
      color: var(--warning);
    }

    .button-row {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    a.button {
      display: block;
      box-sizing: border-box;
      width: 100%;
      padding: 16px 18px;
      border-radius: 14px;
      text-align: center;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--button-text);
      background: var(--button);
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 1rem;
      color: var(--text);
      background: #0c0f15;
    }

    code {
      font-family: Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
    }

    ol {
      padding-left: 1.25rem;
    }

    li {
      margin-bottom: 8px;
    }

    .small {
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
<main>
  <div class="panel">
    <h1>🛜 Connected! </h1>

    <p>
      You have joined the Vercoe network<br>Proceed to step <b>2 of 3 : Certify Csound</b>
      </p>

</body>
</html>
