<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GUI</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="icon" href="./favicon.ico" type="image/x-icon" />
  <style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: black;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    display: block;
    margin: 0;
    flex: none;
    touch-action: none;
  }
</style>
</head>

<body>
  <!--canvas id="mobile" width="390" height="844"></canvas-->
  <canvas id="mobile" data-design-w="390" data-design-h="844"
></canvas>

  <script>window.role = 'leader';</script>

  <script type="module">
    import { initApp } from './js/gui/main.js';
    window.addEventListener('DOMContentLoaded', () => {
      initApp().catch(err => console.error('[main] init failed:', err));
    });
  </script>

</body>
</html>
